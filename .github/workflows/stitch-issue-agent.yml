name: Google Stitch Page Builder

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  generate-stitch-page:
    if: contains(github.event.comment.body, '@stitch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Stitch SDK
        run: npm install @google/stitch-sdk

      - name: Generate HTML Page from Google Stitch
        env:
          STITCH_API_KEY: ${{ secrets.STITCH_AI_KEY }}
          PROMPT: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node -e '
              const fs = require("fs");
              async function run() {
              const { stitch } = await import("@google/stitch-sdk");
              const project = await stitch.createProject("MateflowLab-Issue-" + process.env.ISSUE_NUMBER);
              const generation = await project.generate(process.env.PROMPT.replace("@stitch", "").trim());
              const html = await generation.first.getHtml();
              fs.writeFileSync("stitch-generated-" + Date.now() + ".html", html);
              console.log("Saved HTML page from Google Stitch.");
            }
            run().catch(err => { console.error(err); process.exit(1); });
          '

      - name: Save Generated HTML to Repository
        run: |
          git config user.name "Google Stitch Bot"
          git config user.email "bot@mateflowlab.com"
          git add .
          git commit -m "Add generated HTML page from Google Stitch"
          git push
